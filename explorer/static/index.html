<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuron Explorer</title>
<link rel="stylesheet" href="style.css?v=67">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23151515%22/%3E%3Ccircle cx=%228%22 cy=%228%22 r=%222.5%22 fill=%22%23ffd27a%22/%3E%3C/svg%3E">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <nav id="views">
    <button data-view="map" class="on" data-i18n="nav.map">map</button>
    <button data-view="embed" data-i18n="nav.embeddings">embeddings</button>
  </nav>
  <select id="layer" aria-label="layer" data-i18n-aria-label="header.layer"></select>
  <span class="seg" id="layout-mode" title="sheet layout" data-i18n-title="header.layoutTitle"><button data-k="index" data-i18n="header.layoutIndex">index</button><button data-k="writes" class="on" data-i18n="header.layoutWrites">writes</button></span>
  <span class="seg" id="web-mode" title="connection web of the focused neuron: upstream and downstream cones; yellow links push the reader up, magenta push it down" data-i18n-title="header.webTitle"><button data-w="off" data-i18n="header.webOff">no web</button><button data-w="on" class="on" data-i18n="header.webOn">web</button></span><input id="web-z" value="5" inputmode="numeric" aria-label="web top links" title="web: the open neuron's top links each way" data-i18n-aria-label="header.webZ" data-i18n-title="header.webZTitle">
  <input id="jump" placeholder="L22 N2742" aria-label="go to neuron" spellcheck="false" data-i18n-aria-label="header.jump">
  <span class="seg" id="q-mode"><button data-q="lens" class="on" data-i18n="header.lens">lens</button><button data-q="fires" data-i18n="header.fires">fires</button></span>
  <input id="lens-q" placeholder="search lens" aria-label="search" spellcheck="false" autocomplete="off" data-i18n-placeholder="header.searchLens" data-i18n-aria-label="header.search">
  <span id="status" class="mono"></span>
  <select id="lang" aria-label="Language" title="Language" data-i18n-aria-label="header.language" data-i18n-title="header.language">
    <option value="en">EN</option>
    <option value="zh-CN">中文</option>
  </select>
</header>

<main>
  <section id="map-view" class="view on">
    <canvas id="map"></canvas>
    <div id="layer-labels"></div>
    <button id="layer-back"></button>
  </section>
  <section id="embed-view" class="view">
    <canvas id="scatter"></canvas>
    <div id="embed-empty" class="slot"></div>
    <div id="embed-bar">
      <span class="seg" id="color-by">
        <button data-c="neuron" class="on" data-i18n="view.colorNeuron">neuron</button><button data-c="prompt" data-i18n="view.colorPrompt">prompt</button><button data-c="dose" data-i18n="view.colorDose">dose</button><button data-c="kind" data-i18n="view.colorKind">kind</button>
      </span>
    </div>
    <div id="tip" class="float"></div>
  </section>

  <aside id="list" class="float">
    <div id="focus-head">
      <div class="id-line"><span id="f-id" class="mono"></span><span id="f-rank" class="mono dim"></span><button id="f-close" aria-label="close neuron" data-i18n-aria-label="focus.close">×</button></div>
      <textarea id="f-name" rows="1" placeholder="name" spellcheck="false" aria-label="feature name" data-i18n-placeholder="focus.name" data-i18n-aria-label="focus.featureName"></textarea>
    </div>
    <nav id="ltabs"><button data-lt="net" class="on" data-i18n="list.net">net</button><button data-lt="run" data-i18n="list.run">run</button><button id="list-hide" class="edge" aria-label="hide list" data-i18n-aria-label="list.hide">‹</button></nav>
    <div id="lt-net" class="lpane on">
      <div id="net"></div>
      <div id="list-head">
        <input id="filter" placeholder="filter" spellcheck="false" aria-label="filter by word or name" data-i18n-placeholder="list.filter" data-i18n-aria-label="list.filterAria">
        <label class="dim"><input type="checkbox" id="show-random"> <span data-i18n="list.random">random</span></label>
      </div>
      <ol id="rows" class="rows"></ol>
    </div>
    <div id="lt-run" class="lpane">
      <textarea id="inf-text" rows="6" placeholder="paste text: see which neurons fire most on each token" aria-label="paste text: see which neurons fire most on each token" spellcheck="false" data-i18n-placeholder="list.infText" data-i18n-aria-label="list.infText"></textarea>
      <div id="infer">
        <div id="inf-toks"></div>
        <div id="inf-filters">
          <span class="lab">L</span><input id="inf-lo" value="0" inputmode="numeric" aria-label="from layer" data-i18n-aria-label="list.fromLayer"><span class="lab">–</span><input id="inf-hi" value="31" inputmode="numeric" aria-label="to layer" data-i18n-aria-label="list.toLayer">
          <span class="seg" id="inf-sign"><button data-s="both" class="on">±</button><button data-s="+">+</button><button data-s="-">−</button></span>
          <span class="lab">≥</span><input id="inf-min" value="1.0" inputmode="decimal" aria-label="minimum score" data-i18n-aria-label="list.minScore">
          <input id="inf-q" placeholder="lens has…" aria-label="lens filter" spellcheck="false" data-i18n-placeholder="list.lensHas" data-i18n-aria-label="list.lensFilter">
        </div>
      </div>
      <ol id="run-rows" class="rows"></ol>
    </div>
  </aside>

  <button id="list-tab" class="tab-edge left" aria-label="show list" data-i18n-aria-label="list.show">›</button>
  <button id="focus-tab" class="tab-edge right mono" aria-label="open conversation" data-i18n-aria-label="tabs.openAgent"></button>
  <aside id="focus" class="float">
    <nav id="tabs"><button data-tab="examples" class="on" data-i18n="tabs.examples">Examples</button><button data-tab="chat" data-i18n="tabs.chat">Chat</button><button data-tab="details" data-i18n="tabs.details">Details</button><button data-tab="claude">Claude</button><select id="a-agent" class="mono dim" title="agent for new conversations" aria-label="agent for new conversations" data-i18n-title="tabs.agent" data-i18n-aria-label="tabs.agent"><option value="claude">Claude</option><option value="codex">Codex</option></select><button id="a-past" class="mono dim" title="past conversations" data-i18n-title="tabs.pastTitle" data-i18n="tabs.past">past</button><button id="a-new" class="mono dim" title="start a new conversation" data-i18n-title="tabs.newTitle" data-i18n="tabs.new">new</button><button id="f-collapse" class="edge" aria-label="collapse" data-i18n-aria-label="tabs.collapse">›</button></nav>
    <div id="tab-examples" class="tab on"></div>
    <div id="tab-chat" class="tab">
      <div id="c-lens"></div>
      <div id="c-thread"></div>
      <div id="c-reads"></div>
      <form id="c-form">
        <div id="chat-controls">
          <span class="seg" id="c-mode"><button type="button" data-m="add" class="on" data-i18n="chat.add">add</button><button type="button" data-m="mul">×</button></span>
          <span class="seg" id="c-dir"><button type="button" data-d="writes" class="on" data-i18n="chat.writes">writes</button><button type="button" data-d="reads" data-i18n="chat.reads">reads you</button></span>
          <span class="stepper"><button type="button" id="c-minus" aria-label="smaller" data-i18n-aria-label="chat.smaller">−</button><input id="c-dose" class="mono" inputmode="decimal" aria-label="dose" value="0.8" data-i18n-aria-label="chat.dose"><button type="button" id="c-plus" aria-label="larger" data-i18n-aria-label="chat.larger">+</button></span>
          <button type="button" id="c-clear" class="dim" data-i18n="chat.clear">clear</button>
        </div>
        <div class="row"><input id="c-input" placeholder="Who are you?" aria-label="Who are you?" autocomplete="off" data-i18n-placeholder="chat.who" data-i18n-aria-label="chat.who"><button id="c-go" type="submit" data-i18n="chat.run">run</button></div>
      </form>
    </div>
    <div id="tab-details" class="tab"></div>
    <div id="tab-claude" class="tab">
      <div id="a-thread"><div class="a-empty dim" data-i18n-html="agent.empty">Ask anything about the model, or open a neuron and press <b>explain</b>.</div></div>
      <div id="a-actions"></div>
      <div id="a-files"></div>
      <form id="a-form"><button id="a-attach" type="button" title="attach files (or drop / paste them)" aria-label="attach" data-i18n-title="agent.attachTitle" data-i18n-aria-label="agent.attach">📎</button><input id="a-file" type="file" multiple hidden><textarea id="a-input" rows="1" placeholder="Ask Claude…" aria-label="Ask Claude…" title="while Claude works: Enter interrupts and sends, ⌘/Ctrl+Enter queues" spellcheck="false" data-i18n-placeholder="agent.ask" data-i18n-aria-label="agent.ask" data-i18n-title="agent.inputTitle"></textarea><button id="a-send" type="submit" aria-label="send" data-i18n-aria-label="agent.send">↑</button></form>
    </div>
  </aside>
</main>
<script type="module" src="app.js?v=126"></script>
</body>
</html>
