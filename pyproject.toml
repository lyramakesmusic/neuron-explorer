[project]
name = "neuron-explorer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "numpy",
    "datasets",
    "accelerate",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "sentence-transformers>=6.1.0",
    "umap-learn>=0.5.12",
    # Triton kernels for the linear-attention (Gated DeltaNet) layers; transformers uses them only under CUDA
    "flash-linear-attention>=0.6.0",
    "triton-windows>=3.8.0.post29 ; sys_platform == 'win32'",
]
